<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clínica Veterinaria - Registro de Mascotas</title>
    <link rel="stylesheet" href="style.css"> <!-- Enlace al archivo CSS. Mel queda así para que uses el archivo style.css -->
</head>
<body>

    <h1>Registro de Mascotas</h1>

    <form id="formMascota">
        <label for="nombre">Nombre de la mascota:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="tipo">Tipo:</label>
        <select id="tipo" name="tipo" required>
            <option value="">Seleccione...</option>
            <option value="Perro">Perro</option>
            <option value="Gato">Gato</option>
            <option value="Conejo">Conejo</option>
            <option value="Pájaro">Pájaro</option>
            <option value="Otro">Otro</option>
        </select>

        <label for="edad">Edad (años):</label>
        <input type="number" id="edad" name="edad" min="0" required>

        <label for="dueno">Nombre del dueño:</label>
        <input type="text" id="dueno" name="dueno" required>

        <label>¿Está vacunada?</label>
        <input type="radio" id="vacunadaSi" name="vacunada" value="Sí" required>
        <label for="vacunadaSi">Sí</label>
        <input type="radio" id="vacunadaNo" name="vacunada" value="No">
        <label for="vacunadaNo">No</label>

        <button type="submit">Registrar Mascota</button>
    </form>
    
    <!-- 
    Tabla de registro de mascotas.
    El <thead> contiene los títulos fijos de las columnas.
    El <tbody> se llenará con los datos ingresados en el formulario
    por medio del JavaScript de Brian, una fila por cada mascota registrada.
    -->
    <table id="tablaMascotas">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Edad</th>
                <th>Dueño</th>
                <th>Vacunada</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí se insertarán las mascotas -->
        </tbody>
    </table>

    <script type="module" src="index.js"></script> <!-- Enlace al archivo JavaScript. Brian queda así para que uses el archivo index.js -->
</body>
</html>
